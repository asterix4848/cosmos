name: Feature request
description: Suggest an improvement to Cosmos
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to see?
      description: Explain the problem or use case this feature would address.
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Possible solution
      description: Describe any ideas you have for how it could work.
    validations:
      required: false
